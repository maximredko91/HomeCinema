name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

# There used to be an `instrumented-tests` job here (Compose UI tests on a real/emulated
# device via reactivecircus/android-emulator-runner on macos-latest). Removed - GitHub-hosted
# macOS runners don't support nested virtualization, so Apple's Hypervisor Framework never
# initializes ("HVF error: HV_UNSUPPORTED") and the emulator can never boot, regardless of
# system image architecture (tried both x86_64 and arm64-v8a). This project's actual
# verification loop is unit tests here plus real-device testing via adb, not a CI emulator.
